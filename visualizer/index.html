<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axis Cube Visualizer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>Axis Cube Visualizer</h1>
        <section class="panel">
          <label for="state-input">State number</label>
          <input id="state-input" type="text" placeholder="0x1289fc6d12f36" spellcheck="false" />
          <p id="parse-error" class="error" hidden></p>
          <div class="button-row">
            <button id="load-solved" type="button">Load solved</button>
            <button id="apply-state" type="button">Apply</button>
          </div>
        </section>
        <section class="panel">
          <h2>Current state</h2>
          <p id="state-hex" class="mono"></p>
          <p id="state-dec" class="mono muted"></p>
        </section>
        <section class="panel">
          <h2>Slots <span class="hint">(checkbox = show, click name = cycle 0–3)</span></h2>
          <div id="slot-grid"></div>
        </section>
      </aside>
      <main id="viewport">
        <div id="loading">Loading 3MF model…</div>
        <canvas id="canvas"></canvas>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
